name: Publish to npm
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const version=require('./package.json').version; if(process.env.GITHUB_REF_NAME !== 'v'+version){console.error('Tag '+process.env.GITHUB_REF_NAME+' does not match package v'+version);process.exit(1)}"
      - run: npm install --global npm@latest
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm publish --access public
